<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar perfil</title>
    <link rel="stylesheet" href="adicionarConta.css">
    <link rel="shortcut icon" href="Imagens/Kenzoflix.png">
</head>
<body>
    <form id="adicionar">
        <header>
            <a id="sair" href="index.html">X</a>
            <h1>Adicionar um perfil</h1>
            <h3>Adicione um perfil Kenzoflix para outra pessoa.</h3>
        </header>
        <div id="colocarNome">
            <img src="Imagens/adicionar.jpg">
            <input id="nome" placeholder="Nome">
        </div>
        <hr>
        <div id="crianca">
            <div id="texto">
                <h3>Perfil para crianças</h3>
                <p>Ver apenas séries e filmes indicados no público infantil</p>
            </div>
            <input type="radio" id="opcao">
        </div>
        <div id="opcoes">
            <input type="button" value="Salvar" id="salvar">
            <input type="button" value="Cancelar" id="cancelar">
        </div>

    </form>
</body>
</html>
